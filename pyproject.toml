[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-content-guard"
version = "0.1.0"
description = "Compare DOCX revisions and report non-format content changes locally"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "BaymaxStudio" }]
dependencies = ["python-docx>=1.1,<2"]
keywords = ["docx", "diff", "academic-writing", "document-integrity"]

[project.scripts]
docx-content-guard = "docx_content_guard:main"

[tool.setuptools]
py-modules = ["docx_content_guard"]
